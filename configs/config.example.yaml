# ZX909 Gateway configuration
# Copy to config.yaml and fill in real values.

server:
  # TCP listen address for trackers (the port you set via SMS)
  listen: ":8002"
  # Read timeout for idle connections (trackers send heartbeats)
  read_timeout: 5m
  # Write timeout for ACKs
  write_timeout: 10s

  # Optional vendor shadow / MITM mode (DEBUG ONLY).
  # When enabled the gateway also connects to the official 365gps server,
  # forwards traffic both ways, and logs every byte so we can learn the
  # real protocol conversation. Our own ACKs are suppressed in this mode
  # so the device only talks to the vendor. Turn off once protocol is known.
  vendor_forward:
    enabled: true
    host: "www.365gps.com"
    port: 8002

thingsboard:
  # MQTT broker of your ThingsBoard instance
  host: "localhost"
  port: 1883
  # Access token of the *gateway* device (Is gateway = true)
  access_token: "YOUR_GATEWAY_ACCESS_TOKEN"
  # Optional client ID
  client_id: "zx909-gw-1"
  # Device profile name used when auto-creating child devices
  device_profile: "pet-tracker"
  # QoS for telemetry
  qos: 1
  # Keepalive
  keepalive: 30s

logging:
  level: info   # debug | info | warn | error
