server:
  listen: ":8002"
  read_timeout: 5m
  write_timeout: 10s
  # Debug REST for protocol testing (localhost only recommended)
  debug_api: "127.0.0.1:8090"

thingsboard:
  host: "localhost"
  port: 1883
  access_token: "YOUR_GATEWAY_TOKEN"
  client_id: "zx909-gw"
  password: ""
  device_profile: "pet-tracker"
  qos: 1
  keepalive: 30s
  use_mock: true

# Optional LBS/Wi-Fi → coordinates. When enabled=false (default):
# no external API call and no LBS location telemetry is published.
geolocation:
  enabled: false
  url: "https://location.example.com/v1/geolocate"
  api_key: ""
  timeout: 3s

# Claim-before-uplink: only registered IMEIs get TB connect/telemetry.
# When enabled=false (default), every IMEI is treated as registered.
paapeli:
  enabled: false
  base_url: "https://paapeli.example.com"
  username: "tracker@gmail.com"
  password: "gw_password"
  timeout: 3s
  positive_ttl: 30m   # cache when registered=true
  negative_ttl: 60s   # cache when registered=false (short so claim is picked up)

logging:
  level: info
