server:
  listen: ":8002"
  read_timeout: 5m
  write_timeout: 10s
  # Debug REST for protocol testing (localhost only recommended)
  debug_api: "127.0.0.1:8090"

thingsboard:
  host: "localhost"
  port: 1883
  # Typical CE setup: username = access token, password empty.
  access_token: "YOUR_GATEWAY_TOKEN"
  client_id: "zx909-gw"
  password: ""
  device_profile: "pet-tracker"
  qos: 1
  keepalive: 30s
  # true = no broker (protocol work); false = real Gateway MQTT API
  use_mock: true

# Optional LBS/Wi-Fi → coordinates. When enabled=false (default):
# no external API call and no LBS location telemetry is published.
geolocation:
  enabled: false
  url: "https://location.example.com/v1/geolocate"
  api_key: ""
  timeout: 3s

logging:
  level: info
